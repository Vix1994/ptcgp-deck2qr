[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ptcgp-deck2qr"
version = "0.1.0"
description = "Recognize Pokémon TCG Pocket deck screenshots and emit canonical deck text."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "ptcgp-deck2qr contributors" }]
keywords = ["pokemon", "ptcgp", "computer-vision", "deck-list"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]
dependencies = [
  "numpy>=1.26,<2.3",
  "opencv-python-headless>=4.10,<5",
  "Pillow>=10,<13",
]

[project.scripts]
ptcgp-deck2qr = "ptcgp_deck2qr.cli:main"

[project.optional-dependencies]
dev = [
  "mypy>=1.11,<2",
  "pytest>=8,<9",
  "pytest-cov>=5,<8",
  "ruff>=0.6,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ptcgp_deck2qr = [
  "py.typed",
  "webgui/*.html",
  "webgui/*.css",
  "webgui/*.js",
  "webgui/assets/*.png",
]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["data", "output", "vendor"]

[tool.ruff.lint]
select = ["B", "E", "F", "I", "RUF", "SIM", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["ptcgp_deck2qr"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers --cov=ptcgp_deck2qr --cov-report=term-missing"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["ptcgp_deck2qr"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 90

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests"]
exclude = ["data/", "output/", "vendor/"]
